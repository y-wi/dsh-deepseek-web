name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.19.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm pack:plugin
      - name: packed artifact smoke
        shell: bash
        run: |
          tgz=$(ls packages/plugin/dsh-deepseek-web-*.tgz | head -n 1)
          test -f "$tgz"
          tar -tf "$tgz" | grep -F 'package/wasm/deepseek_web_core_bg.wasm'
          tar -tf "$tgz" | grep -F 'package/wasm/protocol-core-manifest.json'
          tar -tf "$tgz" | grep -F 'package/lib/client.js'
          if tar -xOf "$tgz" package/package.json | grep -q 'workspace:\*'; then
            echo 'tarball contains workspace:*' >&2
            exit 1
          fi
      - name: WASM ABI smoke
        run: node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('packages/plugin/wasm/protocol-core-manifest.json','utf8')); if (m.abiVersion!==2) process.exit(1)"
